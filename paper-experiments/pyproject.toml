[project]
name = "paper-experiments"
version = "0.1.0"
description = "Experiment code for 'Enhancing Data Space Security for Market Uptake'"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
canonicalisation = ["pint>=0.24"]
harness = ["scikit-learn>=1.3", "openpyxl>=3.1", "pint>=0.24", "tifffile>=2024.1"]
test = ["pytest>=7", "pint>=0.24"]

# own pytest root, so the repository-level pytest.ini does not apply
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools]
packages = ["inspector", "inspector.vocab"]

[tool.setuptools.package-data]
"inspector.vocab" = ["*.toml"]
