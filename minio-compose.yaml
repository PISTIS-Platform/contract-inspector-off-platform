services:
  minio-local:
    image: quay.io/minio/minio:latest
    container_name: minio-local
    command: server --address ":9000" --console-address ":9090" /data
    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: localsecret123
    ports:
      - "9000:9000"   # S3 API
      - "9090:9090"   # Console UI
    volumes:
      - minio-local-data:/data

  minio-remote:
    image: quay.io/minio/minio:latest
    container_name: minio-remote
    command: server --address ":9000" --console-address ":9090" /data
    environment:
      MINIO_ROOT_USER: remoteadmin
      MINIO_ROOT_PASSWORD: remotesecret123
    ports:
      - "9002:9000"   # S3 API
      - "9092:9090"   # Console UI
    volumes:
      - minio-remote-data:/data

volumes:
  minio-local-data:
  minio-remote-data:
